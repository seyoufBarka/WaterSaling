<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>SYOUF</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3c72">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --primary:#0d6efd; --primary-dark:#0a58ca; --primary-light:#f5f8fb;
  --accent:#17b8c9; --bg:hsla(185, 76%, 73%, 0.944); --card:#ffffff;
  --text:#1f2a44; --text-muted:#6b7a99; --border:#e3eaf3;
  --success:#1fbf75; --warning:#f5a623; --danger:#e5484d;
  --shadow-sm:0 2px 8px rgba(13,110,253,.06);
  --shadow-md:0 8px 24px rgba(13,110,253,.10);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;}
body{background:var(--bg);color:var(--text);direction:rtl;font-size:15px;line-height:1.6;}
a{color:var(--primary);text-decoration:none;}
button{font-family:inherit;cursor:pointer;}

.screen{display:none;min-height:100vh;}
.screen.active{display:block;}

/* ===== LOGIN ===== */
#loginScreen.active{display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(135deg,#0d6efd 0%,#0a58ca 40%,#17b8c9 100%);
  position:relative;overflow:hidden;}
#loginScreen.active::before,#loginScreen.active::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);}
#loginScreen.active::before{width:420px;height:420px;top:-120px;right:-120px;}
#loginScreen.active::after{width:320px;height:320px;bottom:-100px;left:-100px;}
.login-card{position:relative;z-index:2;background:#fff;border-radius:24px;padding:40px 32px;
  width:100%;max-width:420px;box-shadow:0 30px 60px rgba(0,0,0,.25);text-align:center;
  animation:fadeUp .5s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.login-logo-wrap{width:110px;height:110px;margin:0 auto 18px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary-light),#fff);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(13,110,253,.15);overflow:hidden;}
.login-logo-wrap img{width:80%;height:80%;object-fit:contain;}
.login-card h1{ white-space:pre-line; }
.login-card .subtitle{color:var(--text-muted);font-size:.9rem;margin-bottom:26px;}
.login-field{position:relative;margin-bottom:14px;}
.login-field input{width:100%;padding:14px 46px 14px 14px;font-size:1rem;
  border:2px solid var(--border);border-radius:12px;background:#f9fbfe;transition:.2s;font-family:inherit;}
.login-field input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(13,110,253,.1);}
.login-field .field-icon{position:absolute;top:50%;right:14px;transform:translateY(-50%);
  color:var(--text-muted);width:20px;height:20px;pointer-events:none;}
.btn-login{width:100%;padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:700;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;margin-top:6px;
  transition:.2s;box-shadow:0 6px 18px rgba(13,110,253,.35);}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(13,110,253,.45);}
.error{color:var(--danger);font-size:.88rem;margin-top:10px;min-height:20px;}
.hint{color:var(--text-muted);font-size:.78rem;margin-top:14px;background:#f4f7fb;padding:8px 12px;border-radius:8px;}

/* ===== HEADER ===== */
.app-header{background:#fff;border-bottom:1px solid var(--border);
  padding:12px 20px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm);}
.header-brand{display:flex;align-items:center;gap:12px;}
.header-logo{width:44px;height:44px;border-radius:12px;background:var(--primary-light);
  display:flex;align-items:center;justify-content:center;overflow:hidden;}
.header-logo img{width:100%;height:100%;object-fit:contain;}
.header-brand h1{ white-space:pre-line; line-height:1.15; }
.header-brand p{font-size:.75rem;color:var(--text-muted);margin-top:-2px;}
.header-actions{display:flex;align-items:center;gap:10px;}
.user-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:30px;
  background:var(--primary-light);color:var(--primary-dark);font-weight:600;font-size:.85rem;}
.user-chip .avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;}
.btn-logout{display:flex;align-items:center;gap:6px;padding:8px 14px;border:none;border-radius:10px;
  background:#fff0f0;color:var(--danger);font-weight:600;font-size:.85rem;transition:.2s;}
.btn-logout:hover{background:var(--danger);color:#fff;}

/* ===== DASHBOARD ===== */
.dashboard{padding:28px 20px;max-width:1300px;margin:0 auto;}
.dashboard-title{margin-bottom:22px;}
.dashboard-title h2{font-size:1.5rem;font-weight:800;}
.dashboard-title p{color:var(--text-muted);font-size:.9rem;}
.icon-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;
  max-width:820px;margin:0 auto;}
.icon-card{background:var(--card);border-radius:var(--radius);padding:26px 18px;
  text-align:center;cursor:pointer;border:1px solid var(--border);transition:.25s;
  position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:12px;
  box-shadow:var(--shadow-sm);}
.icon-card::before{content:"";position:absolute;top:0;right:0;width:100%;height:4px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  transform:scaleX(0);transform-origin:right;transition:.3s;}
.icon-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:var(--primary-light);}
.icon-card:hover::before{transform:scaleX(1);}
.icon-card .icon-wrap{width:64px;height:64px;border-radius:18px;background:var(--primary-light);
  display:flex;align-items:center;justify-content:center;color:var(--primary);transition:.25s;}
.icon-card:hover .icon-wrap{background:var(--primary);color:#fff;transform:scale(1.05);}
.icon-card .icon-wrap svg{width:32px;height:32px;}
.icon-card p{font-size:.95rem;font-weight:700;}

/* ===== VIEW ===== */
.view-container{padding:22px;max-width:1300px;margin:0 auto;margin-top:12px;}
.view-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  margin-bottom:2px;background:#fff;padding:16px 20px;border-radius:var(--radius);
  box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.view-header h2{font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:10px;}
.view-header h2 .title-icon{width:38px;height:38px;border-radius:10px;background:var(--primary-light);
  display:flex;align-items:center;justify-content:center;color:var(--primary);}
.view-header h2 .title-icon svg{width:20px;height:20px;}
.view-actions{display:flex;gap:10px;flex-wrap:wrap;}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border:none;border-radius:10px;
  font-weight:700;font-size:.88rem;transition:.2s;white-space:nowrap;font-family:inherit;}
.btn:hover{transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 4px 12px rgba(13,110,253,.3);}
.btn-primary:hover{box-shadow:0 6px 18px rgba(13,110,253,.4);}
.btn-back{background:#f0f3f8;color:var(--text);}
.btn-back:hover{background:#e3e9f2;}
.btn-save{background:var(--success);color:#fff;}
.btn-save:hover{background:#19a563;}
.btn-edit{background:var(--warning);color:#fff;}
.btn-edit:hover{background:#dd8f10;}
.btn-delete{background:var(--danger);color:#fff;}
.btn-delete:hover{background:#c53b40;}
.btn-cancel{background:#e9eef5;color:var(--text-muted);}
.btn-cancel:hover{background:#dde4ee;}
.btn-print{background:#2b3450;color:#fff;}
.btn-print:hover{background:#1f2a44;}
.btn-sm{padding:6px 10px;font-size:.8rem;border-radius:8px;}

/* ===== TABLE ===== */
.table-card{background:#fff;border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.table-wrapper{overflow-x:auto;}
.data-table{width:100%;border-collapse:collapse;min-width:650px;}
.data-table thead th{background:#f6f9fe;color:var(--primary-dark);font-weight:700;font-size:.85rem;
  padding:14px 14px;text-align:right;border-bottom:2px solid var(--border);white-space:nowrap;}
.data-table tbody td{padding:12px 14px;border-bottom:1px solid #eef2f8;font-size:.88rem;vertical-align:middle;}
.data-table tbody tr:last-child td{border-bottom:none;}
.data-table tbody tr:hover{background:#fafcff;}
.data-table input,.data-table select{width:100%;padding:8px 10px;border:2px solid var(--border);border-radius:8px;
  font-size:.85rem;font-family:inherit;background:#fff;transition:.2s;}
.data-table input:focus,.data-table select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,110,253,.1);}
.data-table input[readonly]{background:#f4f7fb;color:var(--text-muted);}
.empty-row td{text-align:center;color:var(--text-muted);padding:10px!important;font-style:italic;}

.user-main-row.new-row td, .user-perms-row.new-row td {background:#fffbe6;}
.user-main-row td { border-bottom: none !important; }
.user-perms-row td { background:#f9fbfe; padding-top:6px !important; padding-bottom:12px !important;
  border-bottom:2px solid var(--border) !important; }
.user-perms-row:hover td { background:#f4f8fd; }
.perms-label{font-size:.78rem;color:var(--text-muted);font-weight:700;margin-bottom:6px;}

.perm-cell{display:flex;flex-wrap:wrap;gap:5px;}
.chk{font-size:.78rem;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:#f4f7fb;border-radius:6px;cursor:pointer;user-select:none;}
.chk input{width:auto;margin:0;}
.badge{display:inline-block;background:var(--primary-light);color:var(--primary-dark);
  padding:3px 8px;border-radius:20px;font-size:.72rem;font-weight:600;margin:1px;}

.barcode-cell{display:flex;gap:6px;align-items:center;}
.barcode-cell input{flex:1;}
.btn-cam{background:var(--accent);color:#fff;border:none;padding:8px 10px;border-radius:8px;font-size:.9rem;}
.btn-cam:hover{background:#12a2b2;}
.btn-stock{background:var(--accent);color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:.75rem;margin-top:3px;font-weight:700;}
.btn-stock:hover{background:#12a2b2;}
.company-cell{display:flex;gap:4px;align-items:center;}
.company-cell select{flex:1;}
.btn-add-company{background:var(--success);color:#fff;border:none;padding:8px 10px;border-radius:8px;
  font-size:1rem;font-weight:800;line-height:1;min-width:32px;}
.btn-add-company:hover{background:#19a563;}

/* ===== COMPANY SETTINGS ===== */
.company-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:20px;}
.company-field{display:flex;flex-direction:column;gap:8px;}
.company-field label{font-weight:700;font-size:.9rem;color:var(--text);}
.company-field input[type=text]{padding:12px 14px;border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:.95rem;}
.company-field input[type=text]:focus{outline:none;border-color:var(--primary);}
.file-box{border:2px dashed var(--border);border-radius:12px;padding:16px;text-align:center;
  background:#f9fbfe;transition:.2s;cursor:pointer;}
.file-box:hover{border-color:var(--primary);background:var(--primary-light);}
.file-box input[type=file]{display:none;}
.file-box .upload-icon{color:var(--primary);margin-bottom:6px;}
.file-box .upload-text{font-size:.85rem;color:var(--text-muted);}
.image-preview{width:100%;height:160px;border-radius:10px;background:#f4f7fb;
  display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:10px;
  border:1px solid var(--border);}
.image-preview img{max-width:100%;max-height:100%;object-fit:contain;}
.image-preview p{color:var(--text-muted);font-size:.85rem;}

/* ===== INVOICE ===== */
.invoice-detail{margin-top:5px;}
.detail-card{background:#fff;padding:28px;border-radius:var(--radius);
  box-shadow:var(--shadow-md);border:1px solid var(--border);}
.inv-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
  padding-bottom:18px;border-bottom:2px dashed var(--border);margin-bottom:18px;flex-wrap:wrap;}
.inv-header .logo-box{width:80px;height:80px;border-radius:14px;background:var(--primary-light);
  display:flex;align-items:center;justify-content:center;overflow:hidden;}
.inv-header .logo-box img{width:85%;height:85%;object-fit:contain;}
.inv-header h2{ white-space:pre-line; }
.inv-meta{text-align:left;font-size:.85rem;color:var(--text-muted);}
.inv-meta p{margin:2px 0;}
.inv-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;
  background:#f6f9fe;padding:14px;border-radius:12px;margin-bottom:18px;}
.inv-info div{font-size:.88rem;}
.inv-info div b{color:var(--primary-dark);}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px;}
.form-grid label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600;}
.form-grid select,.form-grid input{padding:10px 12px;border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:.9rem;}
.form-grid select:focus,.form-grid input:focus{outline:none;border-color:var(--primary);}

.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;
  margin-top:18px;padding:16px;background:#f6f9fe;border-radius:12px;}
.totals .total-item{display:flex;flex-direction:column;gap:2px;}
.totals .total-item span:first-child{font-size:.78rem;color:var(--text-muted);font-weight:600;}
.totals .total-item span:last-child{font-size:1.05rem;font-weight:800;color:var(--primary-dark);}
.totals input{width:100%;padding:6px 10px;border:2px solid var(--border);border-radius:8px;font-family:inherit;}

.print-footer{display:flex;justify-content:space-between;align-items:flex-end;
  margin-top:30px;padding-top:20px;border-top:2px dashed var(--border);}
.print-footer .print-logo{width:90px;height:90px;object-fit:contain;}
.print-footer .print-stamp{width:90px;height:90px;object-fit:contain;}
.print-footer .signature{font-size:.8rem;color:var(--text-muted);text-align:center;}

/* ===== REPORTS ===== */
.reports-tabs{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:5px;}
.reports-tabs button{display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:10px;
  background:#fff;border:2px solid var(--border);color:var(--text);font-weight:700;font-size:.85rem;transition:.2s;font-family:inherit;}
.reports-tabs button:hover{border-color:var(--primary);color:var(--primary);}
.reports-tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.report-content{background:#fff;padding:22px;border-radius:var(--radius);
  box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.report-content h3{color:var(--primary-dark);font-size:1.15rem;margin-bottom:14px;font-weight:800;}
.report-content .data-table{min-width:auto;}

/* ===== SCAN ===== */
.scan-overlay{position:fixed;inset:0;background:rgba(15,25,45,.9);z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.scan-overlay .reader-box{width:100%;max-width:420px;background:#fff;padding:12px;border-radius:14px;}
.scan-overlay .close-scan{margin-top:16px;padding:10px 24px;border:none;border-radius:10px;
  background:var(--danger);color:#fff;font-weight:700;font-family:inherit;}

/* ===== RESPONSIVE ===== */
@media (max-width:768px){
  .dashboard{padding:18px 12px;}
  .dashboard-title h2{font-size:1.2rem;}
  .icon-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:100%;}
  .icon-card{padding:22px 12px;}
  .icon-card .icon-wrap{width:56px;height:56px;}
  .icon-card .icon-wrap svg{width:28px;height:28px;}
  .icon-card p{font-size:.9rem;}
  .view-container{padding:12px;}
  .view-header{padding:12px 14px;}
  .view-header h2{font-size:1.05rem;}
  .header-brand h1{font-size:.95rem;}
  .header-brand p{display:none;}
  .user-chip{display:none;}
  .btn{padding:8px 14px;font-size:.82rem;}
  .detail-card{padding:16px;}
  .inv-header h2{font-size:1.05rem;}
  .login-card{padding:30px 22px;}
  .login-card h1{font-size:1.15rem;}
}
@media (max-width:420px){
  .icon-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
  .icon-card{padding:18px 10px;gap:10px;}
  .icon-card .icon-wrap{width:50px;height:50px;border-radius:14px;}
  .icon-card .icon-wrap svg{width:24px;height:24px;}
  .icon-card p{font-size:.8rem;}
  .btn span.btn-label{display:none;}
}

/* ===== PRINT ===== */
@media print{
  body{background:#fff;}
  .app-header,.view-header,.dashboard,.no-print,.reports-tabs{display:none!important;}
  .view-container{padding:0;max-width:none;}
  .detail-card{box-shadow:none;border:none;padding:0;}
  .data-table thead th{background:#eee!important;}
}
/* إخفاء بطاقات التفاصيل والأزرار عند الطباعة (تبقى ورقة الطباعة فقط) */
@media print{
  #spDetail,
  #invoiceDetail,
  #spSummary,
  #invSummary,
  .inv-actions,
  #spShipWrap > .table-card,
  #spBar{
    display:none !important;
  }
}
.stock-row td{background:#f4f7fb;border-bottom:2px solid var(--border)!important;padding:10px 14px!important;}
.stock-inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.stock-inline .stock-title{font-weight:700;font-size:.85rem;color:var(--primary-dark);}
.stock-inline input{width:160px;}
.stock-actions{display:flex;gap:6px;}
input[list]{background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);
background-position:12px 55%,17px 55%;background-size:5px 5px;background-repeat:no-repeat;padding-left:30px!important;}
#loadBar{display:none;position:fixed;top:0;right:0;left:0;height:4px;z-index:10000;pointer-events:none;
  background:linear-gradient(90deg,var(--primary),var(--accent),var(--primary));background-size:200% 100%;animation:loadMove 1s linear infinite;}
@keyframes loadMove{from{background-position:200% 0}to{background-position:0 0}}
/* تقليص المسافة بين صفوف الجداول */
.data-table tbody td{
  padding:6px 10px !important;
  line-height:1.25 !important;
}
.data-table thead th{
  padding:9px 10px !important;
}
.data-table tbody td input,
.data-table tbody td select{
  padding:5px 8px !important;
}
.data-table .btn-sm{
  padding:4px 8px !important;
}
/* صفوف الصلاحيات والصفوف الفرعية */
.user-main-row td{ padding-bottom:2px !important; }
.user-perms-row td{
  padding-top:3px !important;
  padding-bottom:5px !important;
}
.stock-row td{
  padding:6px 10px !important;
}
.btn-stock{
  padding:3px 7px !important;
  margin-top:1px !important;
}
.form-grid > label{ min-width:0; }
.form-grid > label > select,
.form-grid > label > input{ min-width:0; width:100%; }


#spinnerOverlay{display:none;position:fixed;inset:0;z-index:10001;
  background:transparent;pointer-events:none;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;}
#spinnerOverlay.show{display:flex;}
#spinnerOverlay .spinner{width:56px;height:56px;border-radius:50%;
  border:5px solid rgba(13,110,253,.25);border-top-color:var(--primary);
  animation:spin .8s linear infinite;
  background:rgba(255,255,255,.85);box-shadow:0 8px 24px rgba(0,0,0,.18);}
#spinnerOverlay .spin-text{color:#fff;font-weight:700;font-size:.95rem;letter-spacing:.3px;
  background:rgba(31,42,68,.75);padding:6px 14px;border-radius:20px;}
@keyframes spin{to{transform:rotate(360deg);}}


/* ملاحظات المخزون داخل الفاتورة */
.item-note{color:var(--danger);font-size:.75rem;font-weight:700;margin-top:3px;min-height:0;}
.item-note:empty{display:none;}
.data-table input[readonly].item-price{background:#f4f7fb;color:var(--text-muted);cursor:not-allowed;}

/* المجاميع في عمودين */
.totals.totals-2col{grid-template-columns:repeat(2,minmax(0,1fr));}

/* =========================================================
   Dialog — رسائل منبثقة داخل البرنامج (بديل alert / confirm)
   ========================================================= */
const Dialog = {
  queue:[], busy:false,
  ICON:{
    warn:'<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0zM12 9v4M12 17h.01"/></svg>',
    ok:'<svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',
    ask:'<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3M12 17h.01"/></svg>'
  },
  alert(msg){ return new Promise(res=>{ this.queue.push({type:'alert',msg:String(msg??''),res}); this._next(); }); },
  confirm(msg){ return new Promise(res=>{ this.queue.push({type:'confirm',msg:String(msg??''),res}); this._next(); }); },

  askReason(msg){
    return new Promise(res=>{
      const opts=['البضاعة متوفرة','خراب البضاعة','البضاعة ناقصة','مشكلة التوصيل','عدم الدفع'];
      const ov=document.createElement('div');
      ov.className='dlg-overlay';
      ov.innerHTML=`
        <div class="dlg-box" role="dialog" aria-modal="true">
          <div class="dlg-icon ask">${this.ICON.ask}</div>
          <div class="dlg-msg"></div>
          <select id="dlgReason"
            style="width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:10px;font-family:inherit;margin-bottom:16px;background:#fff;">
            <option value="">اختر سبب الحذف</option>
            ${opts.map(o=>`<option value="${o}">${o}</option>`).join('')}
          </select>
          <div class="dlg-actions">
            <button class="btn btn-delete dlg-ok">تأكيد</button>
            <button class="btn btn-cancel dlg-cancel">إلغاء</button>
          </div>
        </div>`;
      ov.querySelector('.dlg-msg').textContent=msg;
      document.body.appendChild(ov);
      const sel=ov.querySelector('#dlgReason');
      const close=v=>{ov.remove();res(v);};
      ov.querySelector('.dlg-ok').onclick=()=>{
        const v=sel.value.trim();
        if(!v){sel.style.borderColor='var(--danger)';sel.focus();return;}
        close(v);
      };
      ov.querySelector('.dlg-cancel').onclick=()=>close(null);
      setTimeout(()=>sel.focus(),30);
    });
  },
  _next(){
    if(this.busy || !this.queue.length) return;
    this.busy = true;
    const {type,msg,res} = this.queue.shift();
    const isConfirm = type==='confirm';
    const isOk = !isConfirm && /^تم/.test(msg.trim());
    const kind = isConfirm ? 'ask' : (isOk ? 'ok' : 'warn');

    const ov = document.createElement('div');
    ov.className = 'dlg-overlay';
    ov.innerHTML = `
      <div class="dlg-box" role="dialog" aria-modal="true">
        <div class="dlg-icon ${kind}">${this.ICON[kind]}</div>
        <div class="dlg-msg"></div>
        <div class="dlg-actions">
          <button class="btn ${isConfirm?'btn-delete':'btn-primary'} dlg-ok">${isConfirm?'تأكيد':'حسناً'}</button>
          ${isConfirm?'<button class="btn btn-cancel dlg-cancel">إلغاء</button>':''}
        </div>
      </div>`;
    ov.querySelector('.dlg-msg').textContent = msg;
    document.body.appendChild(ov);

    const okBtn = ov.querySelector('.dlg-ok');
    const close = v=>{
      document.removeEventListener('keydown', onKey, true);
      ov.remove();
      this.busy = false;
      res(v);
      this._next();
    };
    const onKey = e=>{
      if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); close(isConfirm?false:true); }
      else if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); close(true); }
    };
    document.addEventListener('keydown', onKey, true);
    okBtn.onclick = ()=>close(true);
    const cb = ov.querySelector('.dlg-cancel');
    if(cb) cb.onclick = ()=>close(false);
    setTimeout(()=>okBtn.focus(),30);
  }
};

const Loader = {
  n:0,
  show(msg){
    this.n++;
    document.getElementById('loadBar').style.display='block';
    const o=document.getElementById('spinnerOverlay');
    if(o){ o.querySelector('.spin-text').textContent = msg || 'جارٍ المعالجة...'; o.classList.add('show'); }
  },
  hide(){
    this.n=Math.max(0,this.n-1);
    if(!this.n){
      document.getElementById('loadBar').style.display='none';
      const o=document.getElementById('spinnerOverlay');
      if(o) o.classList.remove('show');

};

const Api = {
  async call(store, action, data={}, opt={}){
    const c = API_CFG[store];
    if(!c || !c.url || c.url.startsWith('PASTE')){
      const m='رابط السكربت غير مضبوط: '+store;
      if(!opt.quiet) alert(m);
      throw new Error(m);
    }
    if(!opt.quiet) Loader.show();
    try{
      const r = await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({token:c.token,action,...data})});
      const j = await r.json();
      if(!j.ok) throw new Error(j.error||'خطأ غير معروف');
      return j;
    }catch(e){
      if(!opt.quiet) alert(e.message||'تعذر الاتصال بالخادم');
      throw e;
    }finally{
      if(!opt.quiet) Loader.hide();
    }
  }
};

const Sheet = {
  list:(s,o={})=>Api.call(s,'list',o).then(j=>j.rows),
  get:(s,id)=>Api.call(s,'get',{id}).then(j=>j.row),

  update:(s,id,row)=>Api.call(s,'update',{id,row}).then(j=>j.row),

const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = ()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const splitList = s=>String(s??'').split(',').map(x=>x.trim()).filter(x=>x!=='');
const splitCompanyName = full=>{
  const lines = String(full||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  let ar = '', en = '';
  lines.forEach(l=>{
    if(/[\u0600-\u06FF]/.test(l)){ if(!ar) ar = l; }
    else if(!en) en = l;
  });
  if(!ar && !en) ar = 'سيوف لبيع الماء';
  return {ar, en};
};

const M = {

      if(u.password) o.SeyoufUserPass = u.password;
      Object.keys(PERM_COL).forEach(k=>o[PERM_COL[k]] = (u.permissions||[]).includes(k)?'نعم':'لا');

prod:{

   ========================================================= */
const Auth = {
  currentUser:null, KEY:'sioufSession', PHONE_KEY:'sioufLastPhone',
  saveSession(u){localStorage.setItem(this.KEY,JSON.stringify({id:u.id,sig:u.sig}));},
  readSession(){try{return JSON.parse(localStorage.getItem(this.KEY)||'null');}catch(e){return null;}},
  saveLastPhone(p){ try{ localStorage.setItem(this.PHONE_KEY,p); }catch(e){} },
  fillLastPhone(){
    let p=''; try{ p = localStorage.getItem(this.PHONE_KEY)||''; }catch(e){}
    const el = document.getElementById('loginPhone');
    if(el) el.value = p;
  },
 async login(){
  const phone = document.getElementById('loginPhone').value.trim();
  const pass = document.getElementById('loginPassword').value.trim();
  const err = document.getElementById('loginError');
  err.textContent = '';
  if(!phone||!pass){err.textContent='أدخل رقم الهاتف وكلمة المرور';return;}
  err.textContent = 'جارٍ التحقق...';
  Loader.show('جارٍ تسجيل الدخول...');
  let row;
  try{
    row = await Sheet.verify('users',{SeyoufUserPhone:phone,SeyoufUserPass:pass});
    // أول تشغيل: إذا كان الشيت فارغاً يُنشأ المدير الافتراضي
    if(!row && phone==='0000000000' && pass==='admin'){
      const j = await Api.call('users','list',{limit:1});
      if(j.total===0){
        row = await Sheet.add('users',M.user.to({phone,password:pass,name:'المدير العام',role:'manager',repType:'',permissions:Object.keys(PERM_COL)}));
      }
    }
    if(!row){err.textContent='رقم الهاتف أو كلمة المرور غير صحيحة';return;}
    err.textContent = '';
    this.currentUser = M.user.from(row);
    this.saveLastPhone(phone);
    this.saveSession(this.currentUser);
    this.showApp();
  }catch(e){
    err.textContent='';
  }finally{
    Loader.hide();          // <-- الأهم: أخفِ اللودنج دائماً
    if(!this.currentUser) err.textContent = err.textContent || 'رقم الهاتف أو كلمة المرور غير صحيحة';
  }
},
  async checkSession(){
    const s = this.readSession();
    if(!s) return;
    let r;
    try{ r = await Api.call('users','get',{id:s.id}); }catch(e){ return; }
    const u = r.row ? M.user.from(r.row) : null;
    if(!u || u.sig!==s.sig){ localStorage.removeItem(this.KEY); return; }
    this.currentUser = u;
    this.showApp();
  },
  // تحقق في الخلفية من وجود المستخدم وصلاحياته الحالية
  async refresh(){
    if(!this.currentUser) return false;
    let r;
    try{ r = await Api.call('users','get',{id:this.currentUser.id},{quiet:true}); }catch(e){ return true; }
    const u = r.row ? M.user.from(r.row) : null;
    const s = this.readSession();
    if(!u || !s || u.sig!==s.sig){
      this.logout();
      alert('انتهت الجلسة، يرجى تسجيل الدخول من جديد');
      return false;
    }
    this.currentUser = u;
    return true;
  },
  showApp(){
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('appScreen').classList.add('active');
    const name = this.currentUser.name || this.currentUser.phone;
    document.getElementById('userNameChip').textContent = name;
    document.getElementById('userAvatar').textContent = name.charAt(0);
    App.renderDashboard();
  },
  logout(){
    this.currentUser = null;
    localStorage.removeItem(this.KEY);
    document.getElementById('appScreen').classList.remove('active');
    document.getElementById('loginScreen').classList.add('active');
    document.getElementById('viewContainer').innerHTML = '';
    this.fillLastPhone();
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginError').textContent = '';
  },
  isManager(){return !!this.currentUser && this.currentUser.role==='manager';},
hasPermission(k){
  if(!this.currentUser) return false;
  if(this.isManager()) return true;
  if(k==='company') return false;
  if(k==='invoices') return true;      // الفواتير للجميع (كما كان)
  if(k==='salepoints') return true;    // نقاط البيع للجميع (كما كان)
  return (this.currentUser.permissions||[]).includes(k);  // ← المنتجات تُفحص هنا الآن
},
  isRep(){return !!this.currentUser && !!this.currentUser.repType;}
};

// أضف في بداية كائن App
companyData:{id:null,name:'سيوف لبيع الماء',logo:null,stamp:null},
COMP_KEY:'sioufCompany',
sigOf(d){return [d.name||'', (d.logo||'').slice(-32), (d.stamp||'').slice(-32)].join('|');},
saveCompanyCache(d){
  this.companyData = {id:d.id??null,name:d.name||'سيوف لبيع الماء',logo:d.logo||null,stamp:d.stamp||null};
  try{ localStorage.setItem(this.COMP_KEY, JSON.stringify({...this.companyData, sig:this.sigOf(this.companyData)})); }catch(e){}
},
readCompanyCache(){
  try{ return JSON.parse(localStorage.getItem(this.COMP_KEY)||'null'); }catch(e){ return null; }
},
async loadCompany(){
  // 1) اعرض النسخة المحفوظة فوراً (سريع + يعمل بدون إنترنت)
  const cached = this.readCompanyCache();
  if(cached){ this.companyData = {id:cached.id,name:cached.name,logo:cached.logo,stamp:cached.stamp}; this.applyBranding(); }
  // 2) تحقق خفي من الخادم وقارن البصمة
  try{
    const rows = await Sheet.list('company',{limit:1});
    if(rows[0]){
      const fresh = M.comp.from(rows[0]);
      const oldSig = cached ? cached.sig : null;
      const newSig = this.sigOf(fresh);
      if(oldSig !== newSig){
        this.saveCompanyCache(fresh);
        this.applyBranding();
        // إن كانت الصفحة المفتوحة هي شاشة الشركة، حدّث محتواها
        if(document.getElementById('compBody') && App.views.company && typeof App.views.company.refresh === 'function'){
          App.views.company.refresh();
        }
      }
    }
  }catch(e){ /* فشل الشبكة: نبقى على النسخة المحلية */ }
},
applyBranding(){
  const d = this.companyData;
  const arName = splitCompanyName(d.name).ar;
  const set=(id,fn)=>{const el=document.getElementById(id);if(el)fn(el);};
  set('loginLogo',e=>{e.style.visibility='visible';e.src=d.logo||'logo.png';});
  set('headerLogo',e=>{e.style.visibility='visible';e.src=d.logo||'logo.png';});
  set('loginTitle',e=>e.textContent=arName);
  set('headerTitle',e=>e.textContent=arName);
  document.querySelectorAll('[data-company-name]').forEach(el=>el.textContent=arName);
}
};

const InvoiceQuickPay = {
  build(inv){
    if(!inv || !inv.id) return '';
    const id = inv.id, total = Number(inv.total)||0;

   // فاتورة ملغاة: عرض فقط
    if(inv.state==='ملغي'){
      return `
      <div class="total-item"><span>المدفوع</span><span>${inv.paid.toFixed(2)}</span></div>
      <div class="total-item"><span>الباقي</span><span>${inv.remaining.toFixed(2)}</span></div>
      <div class="total-item"><span>الحالة</span><span style="color:var(--danger);">ملغي</span></div>
      <div class="total-item"><span>سبب الإلغاء</span><span class="qp-reason" style="color:var(--danger);">${esc(inv.resDel)||'—'}</span></div>`;
    }

    return `
      <div class="total-item">
        <span>المدفوع</span>
        <input type="number" step="any" min="0" id="qpPaid_${id}" value="${inv.paid}"
          oninput="InvoiceQuickPay.sync('${id}',${total})">
      </div>
      <div class="total-item">
        <span>الباقي</span>
        <input type="number" id="qpRemain_${id}" value="${inv.remaining}" readonly
          style="background:#f4f7fb;color:var(--text-muted);cursor:not-allowed;">
      </div>
      <div class="total-item qp-btn">
        <button class="btn btn-primary" onclick="InvoiceQuickPay.payFull('${id}',${total})">دفع كامل</button>
      </div>
      <div class="total-item qp-btn">
        <button class="btn btn-save" onclick="InvoiceQuickPay.save('${id}',${total})">${ICONS.save} حفظ</button>
      </div>`;
  },

  sync(id,total){
    const p=document.getElementById('qpPaid_'+id), r=document.getElementById('qpRemain_'+id);
    if(!p||!r) return;
    const paid = Math.max(0, parseFloat(p.value)||0);
    r.value = Math.max(0, total-paid).toFixed(2);
  },


  payFull(id,total){
    document.getElementById('qpPaid_'+id).value = Number(total).toFixed(2);
    document.getElementById('qpRemain_'+id).value = '0.00';
  },

    async save(id,total){
    const paid   = Math.max(0, parseFloat(document.getElementById('qpPaid_'+id)?.value)||0);
    const remain = Math.max(0, total-paid);

    if(paid > total + 0.01){
      const go = await Dialog.confirm(
        `المدفوع (${paid.toFixed(2)}) أكبر من إجمالي الفاتورة (${Number(total).toFixed(2)})\n\nهل تريد المتابعة؟`);
      if(!go) return;
    }

    const state = remain<=0.009 ? 'مدفوع' : (paid>0.009 ? 'مدفوع جزئياً' : 'غير مدفوع');

    try{
      Loader.show('جارٍ حفظ التعديل...');
      const current = await Sheet.get('invoices', id);
      if(!current) throw new Error('لم يتم العثور على الفاتورة');
      const update = {...current, SeyoufInvAdvance:paid, SeyoufInvBalance:remain, SeyoufInvState:state};
      delete update._row; delete update._sig;
      await Sheet.update('invoices', id, update);
      Loader.hide();
      await Dialog.alert('تم حفظ التعديل بنجاح');
      InvoicesView.openId = null;
      await InvoicesView.load();
      await InvoicesView.showDetail(id);
    }catch(e){
      Loader.hide();
    }
  }
};

    const name = document.getElementById('nuName').value.trim();
    if(!phone||!pass||!name){alert('رقم الهاتف وكلمة المرور والاسم إلزامية');return;}
    await Sheet.add('users',M.user.to({
      phone,password:pass,name,
      role:document.getElementById('nuRole').value,
      repType:document.getElementById('nuRep').value,
      permissions:this.readPerms('nuPerm')
    }));
    this.newRowOpen=false;
    await this.reload();
  },
  edit(id){this.editingId=id;this.renderRows();},
  async saveEdit(id){
    const old = this.users.find(x=>x.id===id);
    const u = {...old};
    u.phone = document.getElementById(`ePhone_${id}`).value.trim();
    u.password = document.getElementById(`ePassword_${id}`).value.trim(); // فارغ = بدون تغيير
    u.name = document.getElementById(`eName_${id}`).value.trim();
    u.role = document.getElementById(`eRole_${id}`).value;
    u.repType = document.getElementById(`eRep_${id}`).value;
    u.permissions = this.readPerms(`ePerm_${id}`);
    if(!u.phone||!u.name){alert('رقم الهاتف والاسم إلزاميان');return;}
    await Sheet.update('users',id,M.user.to(u));
    // إذا عدّل المستخدم بياناته بنفسه نحدّث جلسته
    if(Auth.currentUser && id===Auth.currentUser.id){
      const r = await Sheet.get('users',id);
      if(r){Auth.currentUser=M.user.from(r);Auth.saveSession(Auth.currentUser);}
    }
    this.editingId=null;
    await this.reload();
  },
  async remove(id){
    if(Auth.currentUser && id===Auth.currentUser.id){alert('لا يمكن حذف حسابك الحالي');return;}
    if(!await Dialog.confirm('تأكيد الحذف؟')) return;
    await Sheet.del('users',id);
    await this.reload();
  }
};
App.views.users = UsersView;

const ProductsView = {
  products:[], editingId:null, newRowOpen:false, loading:false,

  showAct(){return this.priv()||this.newRowOpen;},
  async fetch(){return (await Sheet.list('products')).map(M.prod.from);},
  async render(c){
    this.editingId=null; this.newRowOpen=false; this.products=[]; this.loading=true;
    c.innerHTML = `
      ${headerTpl('المنتجات',ICONS.products,this.priv()?``:'')}
     <div style="display:flex;gap:8px;margin-bottom:5px;background:#fff;padding:14px;border:5px;border-radius:20px;">
  <input id="prodFilterText" placeholder="اسم المنتج أو الشركة..." oninput="ProductsView.renderRows()" style="flex:1;min-width:0;">
  <button class="btn btn-primary" onclick="ProductsView.openNewRow()" style="white-space:nowrap;">${ICONS.plus}<span class="btn-label">إضافة جديد</span></button>
</div>
      <div class="table-card"><div class="table-wrapper">
        <table class="data-table"><thead id="productsHead"></thead><tbody id="productsBody"></tbody></table>
      </div></div>
      <datalist id="companiesList"></datalist>`;
    this.renderRows();
    try{ this.products = await this.fetch(); }catch(e){}

  getFilteredProducts(){
    const text=(document.getElementById('prodFilterText')?.value||'').trim().toLowerCase();
    return this.products.filter(p=>!text||String(p.name||'').toLowerCase().includes(text)||String(p.company||'').toLowerCase().includes(text));
  },
  openNewRow(){this.newRowOpen=true;this.renderRows();},
  cancelNew(){this.newRowOpen=false;this.renderRows();},
  cancelEdit(){this.editingId=null;this.renderRows();},
  renderRows(){
    const act=this.showAct(),priv=this.priv(),mgr=Auth.isManager();
    const colSpan=5+(priv?1:0)+(act?1:0);
    document.getElementById('productsHead').innerHTML=`<tr><th>اسم المنتج</th><th>الشركة</th>${priv?'<th>سعر الشراء</th>':''}<th>السعر</th><th>الكمية</th><th>المصروف</th>${act?'<th>الإجراءات</th>':''}</tr>`;
    const companies=[...new Set(this.products.map(p=>p.company).filter(Boolean))];
    document.getElementById('companiesList').innerHTML=companies.map(n=>`<option value="${esc(n)}"></option>`).join('');

        <td><input id="npCompany" list="companiesList" placeholder="اسم الشركة" autocomplete="off"></td>
        ${priv?'<td><input id="npPurch" type="number" step="any" placeholder="سعر الشراء"></td>':''}
        <td><input id="npPrice" type="number" step="any" placeholder="السعر"></td>
        <td><input id="npQty" type="number" placeholder="الكمية"></td>
        <td><input id="npIssued" type="number" placeholder="المصروف" value="0"></td>
        <td>
          <button class="btn btn-save btn-sm" onclick="ProductsView.saveNew()">${ICONS.save} حفظ</button>
          <button class="btn btn-cancel btn-sm" onclick="ProductsView.cancelNew()">إلغاء</button>
        </td>
      </tr>`;
    }
    filtered.forEach(p=>{
      const isE=this.editingId===p.id;
      html+=`<tr>
        <td>${isE?`<input id="epName_${p.id}" value="${esc(p.name)}">`:esc(p.name)}</td>
        <td>${isE?`<input id="epCompany_${p.id}" list="companiesList" value="${esc(p.company)}" placeholder="اسم الشركة" autocomplete="off">`:(esc(p.company)||'—')}</td>
        ${priv?`<td>${isE?`<input id="epPurch_${p.id}" type="number" step="any" value="${p.purch}">`:p.purch}</td>`:''}
        <td>${isE?`<input id="epPrice_${p.id}" type="number" step="any" value="${p.price}">`:p.price}</td>
      <td>${isE?`<input id="epQty_${p.id}" type="number" value="${p.quantity}">`:p.quantity}</td>
        <td>${p.issued}</td>
       ${act?`<td>${
  isE
    ? `<button class="btn btn-save btn-sm" onclick="ProductsView.saveEdit('${p.id}')">${ICONS.save} حفظ</button>
       <button class="btn btn-cancel btn-sm" onclick="ProductsView.cancelEdit()">إلغاء</button>`
    : `${mgr?`<button class="btn btn-edit btn-sm" onclick="ProductsView.edit('${p.id}')">${ICONS.edit}</button>
       <button class="btn btn-delete btn-sm" onclick="ProductsView.remove('${p.id}')">${ICONS.trash}</button>`:''}
       ${priv?`<button class="btn btn-sm" style="background:var(--accent);color:#fff;" onclick="ProductsView.toggleStock('${p.id}')">+ مخزون</button>`:''}`
}</td>`:''}
      </tr>
      <tr class="stock-row" id="stockRow_${p.id}" style="display:none">
        <td colspan="${colSpan}">
          <div class="stock-inline">
            <span class="stock-title">إضافة مخزون: ${esc(p.name)}</span>
            <input type="number" id="stockQty_${p.id}" placeholder="الكمية المضافة" min="1">
            <input type="number" id="stockPrice_${p.id}" placeholder="سعر الشراء للوحدة" value="${p.purch}" step="any" min="0">
            <div class="stock-actions">
              <button class="btn btn-save btn-sm" onclick="ProductsView.confirmStock('${p.id}')">إضافة</button>
              <button class="btn btn-cancel btn-sm" onclick="ProductsView.toggleStock('${p.id}')">إلغاء</button>
            </div>
          </div>
        </td>
      </tr>`;
    });
    if(!filtered.length&&!this.newRowOpen){
      body.innerHTML=`<tr class="empty-row"><td colspan="${colSpan}">لا توجد منتجات مطابقة</td></tr>`;
      return;
    }
    body.innerHTML=html;
  },
  async reload(){this.products=await this.fetch();this.renderRows();},
  async saveNew(){
    const name=document.getElementById('npName').value.trim();
    if(!name){alert('اسم المنتج إلزامي');return;}
    const p={
      name,
      company:document.getElementById('npCompany').value.trim(),
      purch:num(document.getElementById('npPurch')?.value),
      price:num(document.getElementById('npPrice').value),
      quantity:parseInt(document.getElementById('npQty').value)||0,
      issued:parseInt(document.getElementById('npIssued').value)||0
    };
    const saved=await Sheet.add('products',M.prod.to(p));
    if(p.quantity>0) await PurchasesView.record(M.prod.from(saved),p.quantity,p.purch);
    this.newRowOpen=false;
    await this.reload();
  },
  edit(id){this.editingId=id;this.renderRows();},
  async saveEdit(id){
    const old=this.products.find(x=>x.id===id);
    const p={...old,
      name:document.getElementById(`epName_${id}`).value.trim(),
      company:document.getElementById(`epCompany_${id}`).value.trim(),
      purch:num(document.getElementById(`epPurch_${id}`)?.value ?? old.purch),
      price:num(document.getElementById(`epPrice_${id}`).value),
      quantity:parseInt(document.getElementById(`epQty_${id}`).value)||0
    };
    await Sheet.update('products',id,M.prod.to(p));
    this.editingId=null;
    await this.reload();
  },
  async remove(id){
    if(!await Dialog.confirm('تأكيد الحذف؟')) return;
    await Sheet.del('products',id);
    await this.reload();
  },
  toggleStock(id){
    const row=document.getElementById('stockRow_'+id);
    const show=row.style.display==='none';
    document.querySelectorAll('.stock-row').forEach(r=>r.style.display='none');
    row.style.display=show?'table-row':'none';
    if(show) document.getElementById('stockQty_'+id).focus();
  },
  async confirmStock(id){
    const qty=parseInt(document.getElementById('stockQty_'+id).value);
    const unitPrice=parseFloat(document.getElementById('stockPrice_'+id).value);
    if(!(qty>0)){alert('أدخل الكمية المضافة');return;}
    if(isNaN(unitPrice)||unitPrice<0){alert('أدخل سعر الشراء');return;}
    const p=this.products.find(x=>x.id===id);
    await Sheet.adjust('products',id,{SeyoufProdQnty:qty});
    await PurchasesView.record(p,qty,unitPrice);
    await this.reload();
  }
};
App.views.products = ProductsView;




/* =========================================================
   PurchasesView
   ========================================================= */
const parseRepFilter = v=>{
  v = String(v||'');
  if(v.startsWith('kind:')) return {kind:v.slice(5), user:''};
  if(v.startsWith('user:')) return {kind:'', user:v.slice(5)};
  return {kind:'', user:''};
};

const PurchasesView = {
  allRows: [],          // كل الصفوف المجلوبة من الخادم
  kindByUserCache: null,

  async record(p,qty,unitPrice){
    await Sheet.add('purchases',{
      SeyoufPurchDate:todayStr(),
      SeyoufPurchCompany:p.company||'',
      SeyoufPurchUser:Auth.currentUser.name||Auth.currentUser.phone,
      SeyoufPurchProd:p.name||'',
      SeyoufPurchQnty:qty,SeyoufPurchPrice:unitPrice,SeyoufPurchAmount:qty*unitPrice
    });
  },

  async render(c){
    // جلب المندوبين (المستخدمون الذين لديهم نوع مندوب)
    let reps = [];
    try{
      reps = (await Sheet.list('users')).map(M.user.from).filter(u => u.repType);
    }catch(e){ reps = []; }

    const isRep = Auth.isRep();

    c.innerHTML = `
      ${headerTpl('المشتريات',ICONS.purchases)}
<div class="form-grid" style="margin-bottom:5px;grid-template-columns:${isRep?'1fr 1fr':'1.4fr .9fr 1fr'};">
  <input id="purSearch" placeholder="بحث برقم الشراء أو الشركة أو المنتج..." oninput="PurchasesView.applyFilters()">
  <input id="purDate" type="date" title="تاريخ الشراء" onchange="PurchasesView.applyFilters()">
  ${isRep?'':`
    <select id="purFilterUser" onchange="PurchasesView.applyFilters()">
      <option value="">الكل</option>
      <option value="kind:مندوب محل">مندوب محل</option>
      <option value="kind:مندوب شاحنة">مندوب شاحنة</option>
      ${reps.map(u=>`<option value="user:${esc(u.name)}">${esc(u.name)}</option>`).join('')}
    </select>
  `}
</div>
      <div class="table-card"><div class="table-wrapper">
        <table class="data-table" style="margin-top:5px;">
          <thead><tr><th>رقم الشراء</th><th>تاريخ الشراء</th><th>اسم الشركة</th><th>اسم المستخدم</th><th>اسم المنتج</th><th>الكمية المضافة</th><th>سعر الوحدة</th><th>إجمالي السعر</th></tr></thead>
          <tbody id="purBody"><tr class="empty-row"><td colspan="8">جارٍ التحميل...</td></tr></tbody>
        </table>
      </div></div>
      <div class="totals totals-sticky" id="purTotals"></div>`;

    await this.load();
  },

  /* جلب البيانات من الخادم مرة واحدة (بدون بحث/فلترة) */
  async load(){
    // شرط المطابقة الإجباري للمندوب فقط
    let rows;
    try{
      if(Auth.isRep()){
        rows = await Sheet.search('purchases',{
          match:{ SeyoufPurchUser: Auth.currentUser.name },
          limit: 2000
        });
      }else{
        rows = await Sheet.list('purchases',{order:'desc',limit:2000});
      }
    }catch(e){ rows = []; }

    this.allRows = rows.map(M.purch.from);
    this.applyFilters();
  },

  /* تطبيق البحث النصي + الفلاتر محلياً (بدون أي طلب للخادم) */
  async applyFilters(){
    const q = (document.getElementById('purSearch')?.value||'').trim().toLowerCase();
   const rf = parseRepFilter(document.getElementById('purFilterUser')?.value);
    const filterUser = rf.user, filterKind = rf.kind;
    const dateQ = (document.getElementById('purDate')?.value||'').trim();

    let list = this.allRows.slice();

    // بحث نصي في رقم الشراء / الشركة / المنتج / المستخدم / التاريخ
    if(q){
      list = list.filter(x =>
        String(x.number||'').toLowerCase().includes(q) ||
        String(x.companyName||'').toLowerCase().includes(q) ||
        String(x.productName||'').toLowerCase().includes(q) ||
        String(x.userName||'').toLowerCase().includes(q) ||
        String(x.date||'').toLowerCase().includes(q)
      );
    }
if(dateQ){
  list = list.filter(x => String(x.date||'').slice(0,10) === dateQ);
}
    // فلتر المندوب
    if(filterUser){
      list = list.filter(x => String(x.userName||'') === filterUser);
    }

    // فلتر النوع (يحتاج خريطة اسم المندوب → نوعه)
    if(filterKind && !Auth.isRep()){
      if(!this.kindByUserCache){
        let reps = [];
        try{ reps = (await Sheet.list('users')).map(M.user.from); }catch(e){ reps = []; }
        this.kindByUserCache = {};
        reps.forEach(u => { this.kindByUserCache[u.name] = KIND_LABEL[u.repType||''] || ''; });
      }
      list = list.filter(x => this.kindByUserCache[x.userName] === filterKind);
    }

    // المجاميع
    const totalsEl = document.getElementById('purTotals');
    if(totalsEl){
      totalsEl.innerHTML = `
        <div class="total-item"><span>عدد عمليات الشراء</span><span>${list.length}</span></div>
        <div class="total-item"><span>إجمالي الكمية</span><span>${list.reduce((s,x)=>s+x.qty,0)}</span></div>
        <div class="total-item"><span>إجمالي المشتريات</span><span>${list.reduce((s,x)=>s+x.total,0).toFixed(2)}</span></div>`;
    }

    // الجدول
    const bodyEl = document.getElementById('purBody');
    if(bodyEl){
      bodyEl.innerHTML = list.length ? list.map(x=>`<tr>
        <td><b>${esc(x.number)}</b></td>
        <td>${esc(x.date)}</td>
        <td>${esc(x.companyName)||'—'}</td>
        <td>${esc(x.userName)||'—'}</td>
        <td>${esc(x.productName)||'—'}</td>
        <td>${x.qty}</td>
        <td>${x.unitPrice.toFixed(2)}</td>
        <td><b>${x.total.toFixed(2)}</b></td>
      </tr>`).join('') : '<tr class="empty-row"><td colspan="8">لا توجد مشتريات</td></tr>';
    }
  }
};
App.views.purchases = PurchasesView;

// تطبيق البحث النصي + الفلاتر محلياً ثم رسم الجدول
async applyFilters(){
 const q = (document.getElementById('spSearch')?.value||'').trim().toLowerCase();
const rf = parseRepFilter(document.getElementById('spFilterUser')?.value);
const filterUser = rf.user, filterKind = rf.kind;
const filterState = (document.getElementById('spFilterState')?.value||'').trim();
  let list = (this.list||[]).slice();

  // بحث نصي: رقم الشحنة / اسم المندوب / التاريخ / الهاتف / الحالة
  if(q){
    list = list.filter(x =>
      String(x.number||'').toLowerCase().includes(q) ||
      String(x.userName||'').toLowerCase().includes(q) ||
      String(x.userPhone||'').toLowerCase().includes(q) ||
      String(x.date||'').toLowerCase().includes(q) ||
      String(x.state||'').toLowerCase().includes(q)
    );
  }
if(filterState){
  list = list.filter(x => String(x.state||'') === filterState);
}
  // فلتر المندوب
  if(filterUser){
    list = list.filter(x => String(x.userName||'') === filterUser);
  }

  // فلتر النوع (يعتمد على نوع المندوب المخزن في الشحنة نفسها)
  if(filterKind && !Auth.isRep()){
    list = list.filter(x => String(x.userKind||'') === filterKind);
  }

  this.renderRowsFiltered(list);
},

renderRowsFiltered(list){
  const cm=this.canManage();
  const mgr=Auth.isManager();
  const body=document.getElementById('spBody');
  if(!body) return;
  if(!list.length){
  body.innerHTML=`<tr class="empty-row"><td colspan="${cm?8:7}">لا توجد شحنات</td></tr>`;
    return;
  }
  body.innerHTML=list.map(s=>{
    // زر الاستلام: يظهر للمندوب صاحب الشحنة أو للمدير، فقط عندما تكون الحالة "استلام"
    const canReceive = s.state === 'استلام' &&
      (mgr || (Auth.isRep() && s.userName === Auth.currentUser.name));

    let st = esc(s.state) || '—';
    if(canReceive){
      st = `<button class="btn btn-primary btn-sm" onclick="SalePointsView.confirmReceive('${s.id}')">استلام</button>`;
    }

 let act = '—';
if(cm){
  if(s.state === 'مرجع') act = '—';
  else if(s.state === 'نفاد') act = '<span style="color:var(--danger);font-weight:700;">نفاد الشحنة</span>';
  else act = `<button class="btn btn-edit btn-sm" onclick="SalePointsView.returnShip('${s.id}')">إرجاع الشحنة</button>`;
}

    return `<tr>
      <td><a href="#" onclick="SalePointsView.showDetail('${s.id}');return false;" style="font-weight:700;">${esc(s.number)}</a></td>
      <td>${esc(s.date)}</td>
      <td>${esc(s.userName)||'—'}</td>
      <td>${s.totalGive}</td>
      <td>${s.totalQty}</td>
      <td><b>${s.total.toFixed(2)}</b></td>
      <td>${st}</td>
      ${cm?`<td>${act}</td>`:''}
    </tr>`;

async sharePDF(id){
  if(typeof html2canvas === 'undefined' || !window.jspdf){
    alert('مكتبة PDF لم تُحمَّل بعد، تحقق من الاتصال بالإنترنت وأعد المحاولة');
    return;
  }
  Loader.show('جارٍ إنشاء PDF...');
  try{
    const el = await this.mountPrint(id);
    if(!el){ alert('لا توجد شحنة'); return; }
    const canvas = await html2canvas(el,{scale:2,useCORS:true,backgroundColor:'#ffffff',
      windowWidth:el.scrollWidth,windowHeight:el.scrollHeight});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW, imgH = canvas.height*imgW/canvas.width;
    const imgData = canvas.toDataURL('image/jpeg',0.98);
    let left = imgH, pos = 0;
    pdf.addImage(imgData,'JPEG',0,pos,imgW,imgH);
    left -= pageH;
    while(left>0){
      pos = left-imgH;
      pdf.addPage();
      pdf.addImage(imgData,'JPEG',0,pos,imgW,imgH);
      left -= pageH;
    }
    const no = String(el.dataset.no||'shipment').replace(/[^\w-]/g,'');
    const fileName = 'Shipment_'+no+'.pdf';
    const file = new File([pdf.output('blob')],fileName,{type:'application/pdf'});

    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file],title:'شحنة '+no});
      }catch(e){
        if(e && e.name!=='AbortError') pdf.save(fileName);
      }
    }else{
      pdf.save(fileName);
    }
  }catch(e){
    console.error(e);
    alert('تعذر إنشاء PDF: '+(e.message||e));
  }finally{
    this.unmountPrint();
    Loader.hide();
  }
},

      <td>${esc(inv.date)}</td><td>${esc(inv.userName)||'—'}</td><td>${esc(inv.customerName)||'—'}</td>
      <td><b>${inv.total.toFixed(2)}</b></td><td>${st}</td>
      ${actions}
    </tr>`;
  }).join('');
},

/* أرقام الشحنات لكل منتج بنفس ترتيب المنتجات */
shipsOf(inv){
  const l = splitList(inv.salePoint);
  return inv.items.map((_,i)=> l.length===1 ? l[0] : (l[i]||''));
},
  /* زبائن المندوب الحالي من فواتيره (الأحدث أولاً) */
  customers(){
    const m = new Map();
    (this.allRows||[]).forEach(x=>{
      if(this.curRep && x.userName!==this.curRep) return;
      const n = String(x.customerName||'').trim();
      if(!n || n==='—' || m.has(n)) return;
      m.set(n,{phone:x.customerPhone||'',location:x.customerLocation||''});
    });
    return m;
  },
  refreshCustomers(){
    const dl = document.getElementById('invCustList');
    if(!dl) return;
    dl.innerHTML = [...this.customers().keys()].map(n=>`<option value="${esc(n)}"></option>`).join('');
  },
  onCustomerInput(){
    const n = document.getElementById('invCustomerName').value.trim();
    const c = this.customers().get(n);
    if(!c) return;
    if(c.phone)    document.getElementById('invCustomerPhone').value = c.phone;
    if(c.location) document.getElementById('invCustomerLocation').value = c.location;
  },
  repKind(){
    if(Auth.isRep()&&this.curRep===Auth.currentUser.name) return KIND_LABEL[Auth.currentUser.repType||''];
    const u=this.reps.find(x=>x.name===this.curRep);
    return u?KIND_LABEL[u.repType||'']:'';
  },

  /* عند تغيير المندوب: نمسح المنتجات ونحمّل شحناته المستلمة */
  async onRepChange(){
    this.curRep = document.getElementById('invRep').value;
    this.refreshCustomers();
    this.curShip = null;
    this.products = [];
    document.getElementById('invItemsBody').innerHTML='';
    this.recalc();

    const shipSel = document.getElementById('invShip');
    if(!shipSel) return;

    if(!this.curRep){
      shipSel.innerHTML = '<option value="">— اختر الشحنة —</option>';
      shipSel.disabled = true;
      return;
    }

    await this.loadShipments(this.curRep);
  },

  /* جلب شحنات المندوب المستلمة فقط وعرضها في القائمة */
  async loadShipments(repName){
    const shipSel = document.getElementById('invShip');
    if(!shipSel) return;
    shipSel.innerHTML = '<option value="">جارٍ التحميل...</option>';
    shipSel.disabled = true;

    let rows = [];
    try{
      rows = await Sheet.search('salepoints',{
        match:{ SeyoufSalPontUser: repName },
        order:'desc'
      });
    }catch(e){ rows = []; }

    this.shipments = rows.map(M.salep.from).filter(s => s.state === 'مستلم');

    if(!this.shipments.length){
      shipSel.innerHTML = '<option value="">— لا توجد شحنات مستلمة —</option>';
      shipSel.disabled = true;
      return;
    }

    shipSel.innerHTML = '<option value="">— اختر الشحنة —</option>' +
      this.shipments.map(s =>
        `<option value="${s.id}">${esc(s.number)} — ${esc(s.date)} (كمية: ${s.totalQty})</option>`
      ).join('');
    shipSel.disabled = false;
  },

  /* عند اختيار شحنة: تُحمّل منتجات تلك الشحنة فقط */
 onShipChange(){
  const shipId = document.getElementById('invShip').value;
  this.curShip = null;
  if(!shipId) return;

  const ship = (this.shipments || []).find(s => s.id === shipId);
  if(!ship) return;
  this.curShip = ship;

  // نحدّث منتجات هذه الشحنة فقط ونُبقي منتجات الشحنات الأخرى والصفوف المضافة
  this.products = (this.products||[]).filter(p => p.shipId !== ship.id);
  const map = new Map();
  ship.items.forEach(it => {
    if(it.qty <= 0) return;
    const p = map.get(it.name);
    if(p) p.quantity += it.qty;
    else map.set(it.name, {id:ship.id+'|'+it.name, name:it.name, price:it.price, quantity:it.qty, shipId:ship.id, shipNo:ship.number});
  });
  const list = [...map.values()];
  if(!list.length){
    alert('هذه الشحنة لا تحتوي على كميات متاحة');
    this.recalc();
    return;
  }
  this.products.push(...list);

  if(!document.querySelectorAll('#invItemsBody tr').length) this.addItemRow();
  this.recalc();
},

  onProductChange(el){
    const tr = el.closest('tr');
    const p = this.products.find(x=>x.id===el.value);
    tr.querySelector('.item-price').value = p ? p.price : 0;
    const q = tr.querySelector('.item-qty');
    q.max = p ? p.quantity : '';
    if(p) q.value = p.quantity > 0 ? Math.min(Math.max(num(q.value),1), p.quantity) : 0;
    this.recalc();
  },

  recalc(){
    let qty=0,sub=0,over=false;
    document.querySelectorAll('#invItemsBody tr').forEach(tr=>{
      const price=num(tr.querySelector('.item-price').value),q=num(tr.querySelector('.item-qty').value),rt=price*q;
      const sel=tr.querySelector('select'), p=this.products.find(x=>x.id===sel.value);
      const max = p ? p.quantity : 0;
      const qi = tr.querySelector('.item-qty');
      const note = tr.querySelector('.item-note');
      let msg = '';
      if(p){
        if(max<=0) msg = 'لا يوجد مخزون لهذا المنتج';
        else if(q>max) msg = `لا يمكن الإضافة، الكمية المتاحة أقل (المتاح: ${max})`;
      }
      if(note) note.textContent = msg;
      qi.style.borderColor = msg ? 'var(--danger)' : '';
      qi.title = msg;
      if(msg) over=true;
      tr.querySelector('.item-total').innerHTML = `<b>${rt.toFixed(2)}</b>`;
      qty+=q; sub+=rt;
    });
    const disc=num(document.getElementById('invDisc').value),after=Math.max(0,sub-disc),paid=num(document.getElementById('invPaid').value);
    document.getElementById('invTotalQty').textContent = qty;
    document.getElementById('invSubtotal').textContent = sub.toFixed(2);
    document.getElementById('invTotalAmount').textContent = after.toFixed(2);
    document.getElementById('invRemaining').textContent = (after-paid).toFixed(2);
    const saveBtn = document.querySelector('#invoiceDetail .btn-save');
    if(saveBtn){
      saveBtn.disabled = over;
      saveBtn.style.opacity = over ? .55 : 1;
      saveBtn.style.cursor = over ? 'not-allowed' : '';
    }
  },

 /* إلغاء الفاتورة: إرجاع الكميات إلى شحناتها وتبقى الفاتورة بحالة "ملغي" */
async cancelInvoice(id){
  let inv = this.invoices.find(x=>x.id===id);
  if(!inv){const r=await Sheet.get('invoices',id);if(!r)return;inv=M.inv.from(r);}
  const own = Auth.isRep() && inv.userName===Auth.currentUser.name;
  if(!(Auth.isManager()||own)){alert('لا تملك صلاحية الحذف');return;}
  if(inv.state==='ملغي'){alert('الفاتورة ملغاة مسبقاً');return;}

  const reason = await Dialog.askReason('تأكيد حذف الفاتورة؟\nسيتم إرجاع الكميات إلى الشحنات التي صُرفت منها');
  if(reason===null) return;

  const sh = this.shipsOf(inv);
  const back = inv.items.map((i,k)=>({name:i.name,qty:-i.qty,ship:sh[k]}));
  const redo = inv.items.map((i,k)=>({name:i.name,qty:i.qty,ship:sh[k]}));

  await SalePointsView.sell(inv.userName, back);
  try{

async sharePDF(id){
  if(typeof html2canvas === 'undefined' || !window.jspdf){
    alert('مكتبة PDF لم تُحمَّل بعد، تحقق من الاتصال بالإنترنت وأعد المحاولة');
    return;
  }
  Loader.show('جارٍ إنشاء PDF...');
  try{
    const el = await this.mountPrint(id);
    if(!el){ alert('لا توجد فاتورة'); return; }
    const canvas = await html2canvas(el,{scale:2,useCORS:true,backgroundColor:'#ffffff',
      windowWidth:el.scrollWidth,windowHeight:el.scrollHeight});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW, imgH = canvas.height*imgW/canvas.width;
    const imgData = canvas.toDataURL('image/jpeg',0.98);
    let left = imgH, pos = 0;
    pdf.addImage(imgData,'JPEG',0,pos,imgW,imgH);
    left -= pageH;
    while(left>0){
      pos = left-imgH;
      pdf.addPage();
      pdf.addImage(imgData,'JPEG',0,pos,imgW,imgH);
      left -= pageH;
    }
    const no = String(el.dataset.no||'invoice').replace(/[^\w-]/g,'');
    const fileName = 'Invoice_'+no+'.pdf';
    const file = new File([pdf.output('blob')],fileName,{type:'application/pdf'});

    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file],title:'Invoice '+no});
      }catch(e){
        if(e && e.name!=='AbortError') pdf.save(fileName);
      }
    }else{
      pdf.save(fileName);
    }
  }catch(e){
    console.error(e);
    alert('تعذر إنشاء PDF: '+(e.message||e));
  }finally{
    this.unmountPrint();
    Loader.hide();
  }
},
  
  async savePDF(){
  const el = document.getElementById('printableInvoice');
  if(!el){ alert('لا توجد فاتورة'); return; }

  if(typeof html2canvas === 'undefined' || !window.jspdf){
    alert('مكتبة PDF لم تُحمَّل بعد، تحقق من الاتصال بالإنترنت وأعد المحاولة');
    return;
  }

  Loader.show('جارٍ إنشاء PDF...');
  const hid = el.querySelectorAll('.no-print');
  hid.forEach(x=>x.style.display='none');

  try{
    const canvas = await html2canvas(el, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#ffffff',
      windowWidth: el.scrollWidth,
      windowHeight: el.scrollHeight
    });

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW;
    const imgH = canvas.height * imgW / canvas.width;

    const imgData = canvas.toDataURL('image/jpeg', 0.98);

    let heightLeft = imgH;
    let position = 0;
    pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
    heightLeft -= pageH;

    while(heightLeft > 0){
      position = heightLeft - imgH;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
      heightLeft -= pageH;
    }

    const num = (document.querySelector('#printableInvoice .ip-info-left b')?.textContent || 'invoice')
      .replace(/[^\w-]/g,'');
    pdf.save('Invoice_' + num + '.pdf');
  }catch(e){
    console.error(e);
    alert('تعذر إنشاء PDF: ' + (e.message||e));
  }finally{
    hid.forEach(x=>x.style.display='');
    Loader.hide();
  }
}

  AR:/[\u0600-\u06FF]/,
  init(){
    try{ this.lang = localStorage.getItem(this.KEY)||'ar'; }catch(e){}
    this.keys = Object.keys(this.dict).sort((a,b)=>b.length-a.length);
    new MutationObserver(ms=>{
      if(this.lang!=='en') return;
      ms.forEach(m=>{
        if(m.type==='childList') m.addedNodes.forEach(n=>this.tree(n));
        else if(m.type==='characterData') this.node(m.target);
        else if(m.type==='attributes') this.attrs(m.target);
      });
    }).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','title']});
    this.apply();
  },
  tr(s){
    let o=s;
    for(const k of this.keys){ if(o.indexOf(k)>-1) o=o.split(k).join(this.dict[k]); }
    return o;
  },
  node(n){
    const e=this.store.get(n);
    if(e && n.data===e.tr) return;
    if(!this.AR.test(n.data)){ this.store.delete(n); return; }
    const t=this.tr(n.data);
    this.store.set(n,{orig:n.data,tr:t});
    if(t!==n.data) n.data=t;
  },
  attrs(el){
    ['placeholder','title'].forEach(a=>{
      if(!el.hasAttribute || !el.hasAttribute(a)) return;
      const v=el.getAttribute(a);
      if(el.getAttribute('data-t-'+a)===v || !this.AR.test(v)) return;
      const t=this.tr(v);
      el.setAttribute('data-o-'+a,v); el.setAttribute('data-t-'+a,t); el.setAttribute(a,t);
    });
  },
  tree(root){
    if(root.nodeType===3){ this.node(root); return; }
    if(root.nodeType!==1) return;
    if(root.nodeName==='SCRIPT'||root.nodeName==='STYLE') return;
    this.attrs(root);
    root.querySelectorAll('[placeholder],[title]').forEach(el=>this.attrs(el));
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const arr=[]; while(w.nextNode()) arr.push(w.currentNode);
    arr.forEach(n=>{ const p=n.parentNode&&n.parentNode.nodeName; if(p!=='SCRIPT'&&p!=='STYLE') this.node(n); });
  },
  restore(){
    const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
    const arr=[]; while(w.nextNode()) arr.push(w.currentNode);
    arr.forEach(n=>{ const e=this.store.get(n); if(e && n.data===e.tr){ n.data=e.orig; } this.store.delete(n); });
    ['placeholder','title'].forEach(a=>{
      document.querySelectorAll('[data-o-'+a+']').forEach(el=>{
        if(el.getAttribute(a)===el.getAttribute('data-t-'+a)) el.setAttribute(a,el.getAttribute('data-o-'+a));
        el.removeAttribute('data-o-'+a); el.removeAttribute('data-t-'+a);
      });
    });
  },
  apply(){
    const en=this.lang==='en';
    document.documentElement.lang=this.lang;
    document.documentElement.dir=en?'ltr':'rtl';
    if(en){ this.tree(document.body); document.title=this.tr('سيوف لبيع الماء'); }
    else { this.restore(); document.title='سيوف لبيع الماء'; }
    document.querySelectorAll('.lang-btn .lang-code').forEach(e=>e.textContent=en?'AR':'EN');
  },
  set(l){ this.lang=l; try{localStorage.setItem(this.KEY,l);}catch(e){} this.apply(); },
  toggle(){ this.set(this.lang==='ar'?'en':'ar'); }
};

  App.loadCompany();
  await Auth.checkSession();
  // تحقق دوري كل دقيقة من وجود المستخدم وصلاحياته
  setInterval(async ()=>{
    App.loadCompany();
    if(!Auth.currentUser) return;
    const ok = await Auth.refresh();
    if(ok && document.getElementById('dashboard').style.display!=='none') App.updateCards();
  },300000);
});


/* ============================================================
   تثبيت التطبيق (PWA)
   ============================================================ */
let deferredInstallPrompt = null;

const isStandalone = () =>
  window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);

function showInstallBar() {
  if (isStandalone()) return;
  document.getElementById('installBar').classList.add('show');
  document.body.classList.add('has-install-bar');
}

function hideInstallBar() {
  document.getElementById('installBar').classList.remove('show');
  document.body.classList.remove('has-install-bar');
}

// أندرويد / كروم / إيدج
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBar();
});

document.getElementById('installBtn').addEventListener('click', async () => {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    hideInstallBar(false);
  } else if (isIOS()) {
    alert('لتثبيت التطبيق على الآيفون:\nاضغط زر المشاركة ⬆️ في سفاري\nثم اختر "إضافة إلى الشاشة الرئيسية"');
  }
});

window.addEventListener('appinstalled', () => hideInstallBar(false));

// آيفون: لا يوجد beforeinstallprompt، فنعرض الشريط يدوياً
if (isIOS() && !isStandalone()) {
  document.getElementById('installText').textContent = '📲 للتثبيت: مشاركة ⬆️ ← إضافة إلى الشاشة الرئيسية';
  document.getElementById('installBtn').textContent = 'كيف؟';
  setTimeout(showInstallBar, 2500);
}

// تسجيل الـ Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW error:', err));
  });
}
</script>
